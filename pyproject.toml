[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "impedance-calculator"
version = "1.0.0"
description = "PCB 阻抗计算器：叠层 + 目标阻抗 → 线宽。离线零依赖，以嘉立创在线计算器为参考基准校验"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
keywords = ["pcb", "impedance", "stackup", "si9000", "kicad", "transmission-line"]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
  "Intended Audience :: Manufacturing",
]
# 运行时零依赖：只用 Python 标准库（测试也只用 unittest）
dependencies = []

[project.scripts]
impedance-calculator = "impedance_calculator.__main__:main"

[project.urls]
Homepage = "https://github.com/Kr1s0326/PCB_ROUTER_IMPEDANCE_CALCULATOR"

[tool.setuptools]
packages = ["impedance_calculator"]

[tool.setuptools.package-data]
impedance_calculator = ["py.typed"]
