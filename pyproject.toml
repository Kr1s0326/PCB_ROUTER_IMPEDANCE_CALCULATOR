[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jlc-impedance"
version = "1.0.0"
description = "嘉立创（JLC）阻抗计算器的 Python 复刻：在线引擎客户端 + 离线校准模型"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["pcb", "impedance", "jlcpcb", "stackup", "si9000", "kicad"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
  "Intended Audience :: Manufacturing",
]
# 运行库**零依赖**：只用 Python 标准库
dependencies = []

[project.optional-dependencies]
dev = []          # 测试也只用标准库 unittest

[project.scripts]
jlc-impedance = "jlc_impedance.__main__:main"

[project.urls]
Homepage = "https://github.com/"

[tool.setuptools]
packages = ["jlc_impedance"]

[tool.setuptools.package-data]
jlc_impedance = ["py.typed"]
